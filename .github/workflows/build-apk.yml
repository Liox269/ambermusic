name: Compilar AmberMusic v1.3.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'AmberMusic_v1.3.0_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar Android SDK del ejecutor
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::No se encontró sdkmanager en el ejecutor."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses < /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'

      - name: Preparar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extraer y encontrar proyecto
        shell: bash
        run: |
          set -euo pipefail
          unzip -q AmberMusic_v1.3.0_Source.zip -d workspace
          PROJECT_SETTINGS="$(find workspace -name settings.gradle.kts -type f -print -quit)"
          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle.kts dentro del ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Preparar APK descargable
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" AmberMusic-v1.3.0-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AmberMusic-v1.3.0-APK
          path: AmberMusic-v1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
