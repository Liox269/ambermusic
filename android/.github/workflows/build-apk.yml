name: Construir APK AmberMusic desde celular

on:
  workflow_dispatch:
  push:
    paths:
      - 'AmberMusic_v1.3.0_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Extraer el proyecto
        run: unzip -q AmberMusic_v1.3.0_Source.zip -d workspace
      - name: Compilar APK de depuración
        working-directory: workspace/AmberMusic-Completo
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Preparar nombre de APK
        run: cp workspace/AmberMusic-Completo/app/build/outputs/apk/debug/app-debug.apk AmberMusic-v1.3.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AmberMusic-v1.3.0-APK
          path: AmberMusic-v1.3.0-debug.apk
          retention-days: 30
