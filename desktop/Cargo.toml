[package]
name = "ambermusic-desktop"
version = "0.1.0"
edition = "2021"
description = "AmberMusic desktop core for Linux, Wayland and MPRIS integrations"
license = "MIT"

[features]
default = []
linux-ui = ["dep:gtk4", "dep:libadwaita", "dep:gstreamer", "dep:zbus"]

[dependencies]
gtk4 = { version = "0.9", optional = true }
libadwaita = { version = "0.7", optional = true }
gstreamer = { version = "0.23", optional = true }
zbus = { version = "4", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ambermusic"
path = "src/main.rs"
